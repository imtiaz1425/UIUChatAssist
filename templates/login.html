<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - UIU ChatAssist</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=2.1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="login-container">
        <header class="header">
            <h1 class="university-headline">Meet Your AI-Powered UIU Campus Companion.</h1>
            <div class="logo-icon">
                <i class="fas fa-graduation-cap"></i>
            </div>
            <h2>UIU ChatAssist</h2>
            <p>AI Campus Helpline</p>
        </header>

        <main class="login-card">
            <h2>Welcome back</h2>

            {% if error %}
            <div class="form-error">{{ error }}</div>
            {% endif %}
            
            <form method="POST" action="{{ url_for('login') }}">
                <div class="input-group">
                    <label for="email">University Email</label>
                    <div class="input-wrapper">
                        <i class="far fa-envelope"></i>
                        <input type="email" id="email" name="email" placeholder="student@uiu.ac.bd" value="{{ request.form.get('email', '') }}" required>
                    </div>
                </div>

                <div class="input-group">
                    <div class="label-wrapper">
                        <label for="password">Password</label>
                    </div>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" name="password" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="login-btn">Login</button>
            </form>

            <div class="signup-text">
                New to UIU? <a href="{{ url_for('register') }}">Sign Up</a>
            </div>
        </main>

        <footer class="footer">
            <span class="footer-item"><i class="fas fa-shield-alt"></i> SECURE ACCESS</span>
            <span class="footer-item"><i class="fas fa-headset"></i> IT SUPPORT</span>
        </footer>
    </div>
</body>
</html>
